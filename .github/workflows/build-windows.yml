name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: goyim-screener

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: goyim-screener/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Goyim Screener.exe
        run: pyinstaller build/ema_zone.spec --noconfirm --clean
      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter *.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -Wait -PassThru
          Get-ChildItem -Recurse -Filter selftest.txt | ForEach-Object { Get-Content $_.FullName }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist/*" -DestinationPath "Windows-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-app
          path: goyim-screener/Windows-app.zip
          retention-days: 30
